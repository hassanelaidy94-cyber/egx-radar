<style>

    --bg:#0b1226; --card:#111a33; --line:#1d2a4d; --inset:#0a1022;

    --gold:#e8b94a; --gold-bg:rgba(232,185,74,.12); --gold-line:rgba(232,185,74,.45);
    --up:#3ddc97; --down:#ff6b81; --flat:#8a96b8;

  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  .num{font-family:'JetBrains Mono',ui-monospace,monospace;direction:ltr;unicode-bidi:isolate;font-weight:700}
  header{position:sticky;top:0;z-index:5;background:rgba(11,18,38,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-size:20px;font-weight:800}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--flat)}
  .dot.live{background:var(--up);animation:pulse 1s infinite}
  .dot.delayed{background:var(--gold)}
  .dot.demo{background:var(--cyan)}
  @keyframes pulse{50%{opacity:.35}}
  .banner{margin-top:8px;font-size:12.5px;line-height:1.6;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:10px;padding:7px 10px}
  .tools{display:flex;gap:8px;margin-top:10px}
  .tools input,.tools select{flex:1;min-width:0;background:var(--inset);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
  .tools select{flex:0 0 auto}
  .chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}

  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  main{padding:14px 14px 40px;display:grid;gap:14px;max-width:720px;margin:0 auto}
  .empty{text-align:center;color:var(--mute);padding:40px 12px;line-height:1.8}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 8px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .id{text-align:right;min-width:0;flex:1}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:8px;padding:3px 10px;margin-bottom:8px}
  .badge.sell{color:var(--down);background:rgba(255,107,129,.1);border-color:rgba(255,107,129,.4)}
  .badge.none{color:var(--mute);background:transparent;border-color:var(--line)}
  .name{font-size:19px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
  .meta{font-size:13.5px;color:var(--cyan);margin-top:2px}
  .px{text-align:left;flex:0 0 auto}
  .price{font-size:26px;line-height:1.1;transition:color .4s}
  .price.up{color:var(--up)} .price.down{color:var(--down)}
  .chg{font-size:14px;margin-top:4px}
  .chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--flat)}
  .levels{display:grid;grid-template-columns:repeat(3,1fr);background:var(--inset);border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:12px 6px;text-align:center}
  .lv small{display:block;color:var(--mute);font-size:12.5px;margin-bottom:2px}
  .lv .num{font-size:17px}
  .lv.entry .num{color:var(--cyan)} .lv.target .num{color:var(--up)} .lv.stop .num{color:var(--down)}
  .open{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;border-top:1px solid var(--line);margin-top:14px;padding:12px 2px;color:var(--gold);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .open svg{transition:transform .25s}
  .open[aria-expanded=true] svg{transform:rotate(-90deg)}
  .report{display:none;padding:2px 0 14px}
  .report.show{display:block}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .m{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
  .m small{display:block;color:var(--mute);font-size:12px}
  .m .num{font-size:15px}
  .spark{width:100%;height:56px;margin-top:10px;display:block}
  .why{margin-top:10px;padding-right:18px;font-size:13.5px;line-height:1.9;color:var(--mute)}
  .score{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--mute)}
  .bar{flex:1;height:6px;background:var(--inset);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);transition:width .6s}
  .star{background:none;border:0;color:var(--mute);font-size:26px;line-height:1;padding:2px 0;margin-top:2px;cursor:pointer}
  .star[aria-pressed=true]{color:var(--gold)}
  .note{margin-top:8px;font-size:12.5px;color:var(--gold);line-height:1.7}
  .sig{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--inset);font-size:14px}
  .sig b{font-size:16px;font-weight:800}
  .sig small{color:var(--mute);font-size:12.5px;line-height:1.5;text-align:left}
  .sig.buy{border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.1)} .sig.buy b{color:var(--up)}
  .sig.sell{border-color:rgba(255,107,129,.5);background:rgba(255,107,129,.1)} .sig.sell b{color:var(--down)}
  .sig.wait b,.sig.na b{color:var(--mute)}
  .conds{list-style:none;margin-top:10px;padding:0;font-size:13.5px;line-height:1.9;color:var(--mute)}
  .conds .ok{color:var(--up)} .conds .no{color:var(--down)}
  .fc{margin-top:12px;font-size:14px;line-height:1.7;color:var(--text)}
  .fc b{font-weight:800}.fc .up{color:var(--up)}.fc .down{color:var(--down)}.fc .side{color:var(--mute)}
  .fc small{color:var(--mute);font-size:12.5px;display:block}
  .ol{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .track{margin-top:8px;font-size:12.5px;color:var(--mute)}
  .tb{width:100%;border-collapse:collapse;margin:8px 0}.tb th,.tb td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line,#22305a)}.mute2{opacity:.8;margin-top:6px}
  #trackd summary{cursor:pointer;color:var(--gold)}
  .warnl,.pl{margin:8px 0 0;font-size:13px;line-height:1.7}.warnl{color:var(--gold)}.warnl:empty,.pl:empty{display:none}
  .pl.up{color:var(--up)}.pl.down{color:var(--down)}
  .pf{margin-top:12px;padding:10px;border:1px solid #22305a;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pf b{grid-column:1/-1;font-size:13px}.pf label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
  .pf input{background:#0b1226;border:1px solid #22305a;border-radius:8px;color:inherit;padding:7px 8px;font:inherit;width:100%;box-sizing:border-box}

  footer{max-width:720px;margin:0 auto;padding:0 18px 28px;font-size:12.5px;color:var(--mute);line-height:1.8;text-align:center}
  @media (prefers-reduced-motion:reduce){.dot.live{animation:none}.price,.bar i,.open svg{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>رادار البورصة</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="stat">جاري الاتصال</span></div>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="tools">
    <input id="q" type="search" placeholder="ابحث بالاسم أو الرمز" aria-label="بحث">
    <select id="sort" aria-label="الترتيب">
      <option value="score">الأقوى تحليلًا</option>
      <option value="chg">الأعلى ارتفاعًا</option>
      <option value="vol">الأعلى سيولة</option>
      <option value="pl">محفظتي: الأكبر خسارة أولًا</option>
      <option value="plw">محفظتي: الأكبر ربحًا أولًا</option>
    </select>
  </div>
  <div id="mkt"></div><div id="pfsum"></div>
  <div class="track" id="track"></div><div class="track" id="trackd"></div>
  <div class="note" id="note" hidden>الترشيح إحصائي من المؤشرات (ميل صاعد بثقة متوسطة أو قوية، وRSI تحت 80). مش ضمان إن السهم هيصعد.</div>
  <div class="chips" id="chips" role="group" aria-label="تصفية">
    <button class="chip" data-f="all" aria-pressed="true">الكل</button>
    <button class="chip" data-f="sbuy" aria-pressed="false">شراء الآن</button>
    <button class="chip" data-f="ssell" aria-pressed="false">بيع الآن</button>
    <button class="chip" data-f="fav" aria-pressed="false">المفضلة ★</button>
    <button class="chip" data-f="pf" aria-pressed="false">محفظتي</button>
    <button class="chip" data-f="rise" aria-pressed="false">مرشحة للصعود</button>
    <button class="chip" data-f="vol" aria-pressed="false">اختراق سيولة</button>
    <button class="chip" data-f="up" aria-pressed="false">زخم صاعد</button>
    <button class="chip" data-f="sell" aria-pressed="false">ضغط بيع</button>
  </div>
</header>
<main id="list"></main>
<footer>
  <div class="risk"><label>رأس المال (ج)<input id="cap" type="number" inputmode="decimal" min="0" step="any"></label>
  <label>المخاطرة لكل صفقة (%)<input id="rk" type="number" inputmode="decimal" min="0" max="100" step="any"></label></div>
  <div class="bk"><button id="bkx" type="button">نسخ احتياطي لمفضلتي ومحفظتي</button><button id="bki" type="button">استرجاع نسخة</button><button id="bke" type="button">تصدير بيانات التتبع</button></div>
  تحليل آلي للمعلومات فقط، وليس توصية بيع أو شراء. الأسعار قد تتأخر حسب مصدر البيانات.
</footer>

  { const sg = a.signal; setText(c, 'sigt', sg.t); setText(c, 'sigw', sg.why);
    const cl = 'sig ' + sg.k; if (r.sigbox.className !== cl) r.sigbox.className = cl; }
  setText(c, 'entry', f2(a.p)); setText(c, 'target', f2(a.target)); setText(c, 'stop', f2(a.stop));
  if (c.open()) {
    setText(c, 'rsi', f2(a.rsi)); setText(c, 'macd', f2(a.macd));
    setText(c, 'vr', Number.isFinite(a.volRatio) ? a.volRatio.toFixed(2) + 'x' : '—');
    setText(c, 'e9', f2(a.ema9)); setText(c, 'e21', f2(a.ema21)); setText(c, 'rr', f2(a.rr));
    setText(c, 'olr', `${f2(a.outlook.lo)} - ${f2(a.outlook.hi)}`);
    setText(c, 'olw', `${f2(a.outlook.wlo)} - ${f2(a.outlook.whi)}`);
    setText(c, 'sc', a.score + '/100');
    r.bar.style.width = a.score + '%';
    const s = (state.series[u[0]] || []).slice(-60);
    if (s.length >= 2) {
      const mn = Math.min(...s), mx = Math.max(...s), rg = mx - mn || 1;
      r.line.setAttribute('points', s.map((y, i) => `${(i / (s.length - 1) * 300).toFixed(1)},${(52 - (y - mn) / rg *48).toFixed(1)}`).join(' '));
    }
    const cj = a.signal.conds.map(x => (x.ok ? '1' : '0') + x.t).join('|');
    if (c.last.cj !== cj) { c.last.cj = cj; r.conds.innerHTML = ''; a.signal.conds.forEach(x => { const li = document.createElement('li'); li.className = x.ok ? 'ok' : 'no'; li.textContent = (x.ok ? '✓ ' : '✗ ') + x.t; r.conds.appendChild(li); }); }
    const w = a.why.join('|');
    if (c.last.why !== w) { c.last.why = w; r.why.innerHTML = ''; a.why.forEach(t => { const li = document.createElement('li'); li.textContent = t; r.why.appendChild(li); }); }
  }
  return c;
}

function plPct(t, a) { const e = pf[t]; return e && e.c ? (a.p / e.c - 1) * 100 : (sortBy === 'pl' ? 1e9 : -1e9); }
function lowLiq(a) { return state.mode === 'live' && a.liq > 0 && a.liq < 200000; }
function passes(u, a) {
  if (query) {
    const q = query.toLowerCase();
    if (!(u[0].toLowerCase().includes(q) || u[1].toLowerCase().includes(q))) return false;
  }
  if (filter === 'all') return true;
  if (filter === 'fav') return favs.has(u[0]);
  if (filter === 'pf') return !!pf[u[0]];
  if (filter === 'sbuy') return a.signal.k === 'buy' && !lowLiq(a);
  if (filter === 'ssell') return a.signal.k === 'sell';
  if (filter === 'rise') return !lowLiq(a) && a.outlook.bias === 'up' && a.outlook.conf !== 'ضعيفة' && !(a.rsi > 80);
  return a.badge.k === filter || (filter === 'up' && a.badge.k === 'up');
}

function render(force) {
  const frac = sessionFraction(new Date(), state.mode === 'demo');
  const mOpen = isMarketOpen(new Date(), state.mode === 'demo');
  const rows = [];
  { let up = 0, dn = 0;
    for (const t in state.live) { const c = state.live[t].chg; if (c > 0.005) up++; else if (c < -0.005) dn++; }
    const tot = up + dn; mkt.weak = state.mode === 'live' && tot >= 20 && up / tot < 0.35;
    const m = $('mkt'); if (m) { m.textContent = tot ? `السوق: ${up} صاعد • ${dn} هابط` + (mkt.weak ? ' (السوق ضعيف، خد حذرك مع إشارات الشراء)' : '') : ''; m.className = mkt.weak ? 'bad' : ''; } }
  let pCost = 0, pVal = 0;
  for (const u of UNIVERSE) {
    const l = state.live[u[0]];
    if (!l || !(l.p > 0)) continue;
    const a = analyze(l, frac, mOpen);
    { const e = pf[u[0]]; if (e) { checkAlert(u, a.p); if (e.q && e.c) { pCost += e.q * e.c; pVal += e.q * a.p; } } }
    state.res[u[0]] = a;
    const sr = state.series[u[0]] || (state.series[u[0]] = []);
    if (sr[sr.length - 1] !== a.p) { sr.push(a.p); if (sr.length > 90) sr.shift(); }
    rows.push([u, a]);
    if (passes(u, a)) paint(u, a);
  }
  { const el = $('pfsum'); if (el) {
    const d = pVal - pCost, up = d >= 0, pc = pCost > 0 ? Math.abs(d / pCost * 100).toFixed(2) : '0.00';
    const fmt = n => Math.round(n).toLocaleString('en-US');
    let html = '';
    if (pCost > 0) {
      if (filter === 'pf') html = `<div class="wl">قيمة محفظتي (ج.م)</div><div class="wv num">${fmt(pVal)}</div><div class="wd num ${up ? 'up' : 'down'}">${up ? '+' : '−'}${fmt(Math.abs(d))} <span>${up ? '▲' : '▼'} ${pc}%</span></div><div class="wc">التكلفة ${fmt(pCost)} ج.م</div>`;
      else html = `محفظتي: ${up ? 'ربح' : 'خسارة'} ${Math.abs(d).toFixed(2)} ج (${up ? '+' : '−'}${pc}%) على تكلفة ${pCost.toFixed(2)} ج`;
    }
    el.className = filter === 'pf' && pCost > 0 ? 'wealth' : '';
    if (el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; } } }
  const now = Date.now();
  if (force || now - lastSort > CONFIG.RESORT_MS) {
    lastSort = now;
    const vis = rows.filter(([u, a]) => passes(u, a));
    vis.sort((x, y) => (filter === 'all' && favs.has(x[0][0]) !== favs.has(y[0][0])) ? (favs.has(y[0][0]) ? 1 : 0) - (favs.has(x[0][0]) ? 1 : 0) : sortBy === 'pl' || sortBy === 'plw' ? (plPct(x[0][0], x[1]) - plPct(y[0][0], y[1])) * (sortBy === 'pl' ? 1 : -1) :
      sortBy === 'chg' ? y[1].chg - x[1].chg : sortBy === 'vol' ? (y[1].volRatio || 0) - (x[1].volRatio || 0) : y[1].score - x[1].score);
    order = vis.map(([u]) => u[0]);
    const keep = new Set(order);
    listEl.querySelectorAll('.empty').forEach(n => n.remove());
    for (const [t, c] of cards) if (!keep.has(t) && c.el.parentNode) c.el.remove();
    order.forEach(t => listEl.appendChild(cards.get(t).el));
    if (!order.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = rows.length ? (filter === 'fav' ? 'مفيش أسهم في المفضلة. اضغط على النجمة ★ في أي سهم عشان تضيفه.' : filter === 'pf' ? 'محفظتك فاضية. افتح التقرير الكامل لأي سهم واكتب الكمية وسعر الشراء.' : 'مفيش أسهم بتطابق التصفية دلوقتي. جرّب فلتر تاني.') : 'مستني أول بيانات من المصدر.'; listEl.appendChild(d); }
  }
}

function setStatus() {
  const dot = $('dot'), st = $('stat'), bn = $('banner');
  const t = state.lastTs ? new Date(state.lastTs).toLocaleTimeString('ar-EG', { timeZone: 'Africa/Cairo' }) : '';
  if (state.mode === 'demo') {
    dot.className = 'dot demo'; st.textContent = 'تجريبي ' + t;
    bn.hidden = false;
    bn.textContent = 'وضع تجريبي: الأسعار هنا مولّدة عشوائيًا وليست أسعار السوق. اربط التطبيق بالخادم (api/quotes.js) عشان يعرض بيانات حقيقية.';
  } else if (state.mode === 'live') {
    if ((state.fail || 0) >= 3) {
      dot.className = 'dot delayed'; st.textContent = 'انقطع الاتصال، آخر تحديث ' + t;
      bn.hidden = false; bn.textContent = 'مش قادر أوصل للسيرفر. الأسعار المعروضة هي آخر ما اتحدث، فما تعتمدش عليها لحد ما الاتصال يرجع.';
    } else { dot.className = 'dot live'; st.textContent = 'مباشر ' + t; bn.hidden = true; }
  } else { dot.className = 'dot'; st.textContent = 'جاري الاتصال'; }
}

/* ---------------- سجل دقة التوقعات ---------------- */
// الإصدار 2: شرط العرضي أضيق (0.5%) + بيسجل مؤشرات كل توقع عشان نحلل بعدين إيه اللي بيفرق فعلًا
const TRK = 'egx_track_v2', SIDE = 0.5, LOG_MAX = 6000;
function trkLoad() { try { const t = JSON.parse(localStorage.getItem(TRK)); if (t && t.open) return t; } catch (e) {} return { open: {}, hit: 0, n: 0, by: {}, sg: {}, base: { n: 0, side: 0, up: 0, down: 0 }, log: [] }; }
let trkDirty = false;
function trkSave(t) { if (!trkDirty) return; trkDirty = false; try { localStorage.setItem(TRK, JSON.stringify(t)); } catch (e) {} }
function cairoNow() {
  const f = new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const g = k => f.find(p => p.type === k).value;
  return { day: `${g('year')}-${g('month')}-${g('day')}`, wd: g('weekday'), mins: +g('hour') * 60 + +g('minute') };
}
const r2 = x => Number.isFinite(x) ? Math.round(x * 100) / 100 : null;
function track() {
  const t = trkLoad();
  if (state.mode === 'live') {
    const c = cairoNow();
    if (c.wd !== 'Fri' && c.wd !== 'Sat') {
      // الجلسة الجديدة بدأت: قيّم التوقعات القديمة، وقارنها بحركة السوق كله (الوسيط) مش بالصفر بس
      const due = [];
      for (const sym in state.res) { const o = t.open[sym]; if (o && o.d < c.day && c.mins >= 660) due.push([sym, o, state.res[sym]]); }
      let med = null;
      if (due.length >= 20) { const m = due.map(([, o, a]) => (a.p / o.p - 1) * 100).sort((x, y) => x - y); med = m[m.length >> 1]; t.mk = t.mk || { n: 0, sum: 0 }; t.mk.n++; t.mk.sum += med; }
      for (const [sym, o, a] of due) {
          const mv = (a.p / o.p - 1) * 100, ex = med === null ? null : mv - med;
          const ok = o.b === 'up' ? mv > 0.3 : o.b === 'down' ? mv < -0.3 : Math.abs(mv) <= SIDE;
          t.n++; if (ok) t.hit++;
          const k = o.b + '|' + (o.c || '?'), r = t.by[k] || (t.by[k] = { n: 0, h: 0, sum: 0 });
          r.n++; r.sum = (r.sum || 0) + mv; if (ok) r.h++;
          if (ex !== null) { r.en = (r.en || 0) + 1; r.ex = (r.ex || 0) + ex; if (o.b === 'up' ? ex > 0 : o.b === 'down' ? ex < 0 : false) r.bt = (r.bt || 0) + 1; }
          const B = t.base; B.n++; if (Math.abs(mv) <= SIDE) B.side++; if (mv > 0.3) B.up++; if (mv < -0.3) B.down++;
          if (o.s === 'buy' || o.s === 'sell') {
            const g = t.sg[o.s] || (t.sg[o.s] = { n: 0, w: 0, sum: 0 });
            g.n++; g.sum += mv; if (o.s === 'buy' ? mv > 0 : mv < 0) g.w++;
            if (ex !== null) { g.en = (g.en || 0) + 1; g.ex = (g.ex || 0) + ex; }
          }
          t.log.push({ s: sym, d: o.d, b: o.b, c: o.c, k: o.s, p: o.p, r: o.r, v: o.v, sc: o.sc, w: o.w, ch: o.ch, mv: r2(mv), ex: ex === null ? null : r2(ex) });
          if (t.log.length > LOG_MAX) t.log.splice(0, t.log.length - LOG_MAX);
          delete t.open[sym]; trkDirty = true;
      }
      for (const sym in state.res) {
        const a = state.res[sym];
        if (!t.open[sym] && c.mins >= 870) {                  // بعد الإغلاق: سجّل توقع اليوم التالي ومؤشراته
          t.open[sym] = { d: c.day, p: a.p, b: a.outlook.bias, c: a.outlook.conf, s: a.signal.k, r: r2(a.rsi), v: r2(a.volRatio), sc: a.score, w: a.wtrend, ch: r2(a.chg) };
          trkDirty = true;
        }
      }
      trkSave(t);
    }
  }
  $('track').textContent = t.n > 0
    ? `دقة التوقعات المسجلة: ${t.hit} من ${t.n} (${Math.round(t.hit / t.n * 100)}%)`
    : 'سجل الدقة: التوقعات بتتسجل بعد إغلاق كل جلسة، والنتيجة بتظهر بعد الجلسة اللي بعدها.';
  const B = { up: 'صعود', down: 'هبوط', side: 'عرضي' }, pc = (h, n) => n ? Math.round(h / n * 100) + '% (' + h + '/' + n + ')' : '—';
  let h = '<table class="tb"><tr><th>التوقع</th><th>اتفاق المؤشرات</th><th>الدقة</th><th>متوسط الحركة</th><th>الفرق عن السوق</th></tr>';
  const keys = Object.keys(t.by || {}).sort();
  for (const k of keys) { const [b, c] = k.split('|'), x = t.by[k]; h += `<tr><td>${B[b] || b}</td><td>${c}</td><td>${pc(x.h, x.n)}</td><td>${x.n && x.sum !== undefined ? (x.sum / x.n).toFixed(2) + '%' : '—'}</td><td>${x.en ? (x.ex / x.en >= 0 ? '+' : '') + (x.ex / x.en).toFixed(2) + '%' + (b === 'side' ? '' : ' • غلبت السوق ' + Math.round((x.bt || 0) / x.en * 100) + '%') : '—'}</td></tr>`; }
  h += '</table>';
  const S = { buy: 'إشارة شراء', sell: 'إشارة بيع' };
  let g = '';
  const bs = t.base;
  if (bs && bs.n > 0) g += `<div><b>خط الأساس</b> (بدون أي تحليل): لو قلنا «عرضي» لكل الأسهم كانت الدقة ${Math.round(bs.side / bs.n * 100)}%، و«صعود» ${Math.round(bs.up / bs.n * 100)}%، و«هبوط» ${Math.round(bs.down / bs.n * 100)}%. أي توقع لازم يعدّي نسبته عشان نقول إن التحليل بيضيف حاجة.</div>`;
  if (t.mk && t.mk.n) g += `<div>متوسط حركة السوق (الوسيط) في الجلسة: ${(t.mk.sum / t.mk.n).toFixed(2)}% (على ${t.mk.n} جلسة)</div>`;
  for (const k of ['buy', 'sell']) { const x = (t.sg || {})[k]; if (x && x.n) g += `<div>${S[k]}: نجحت ${pc(x.w, x.n)} • متوسط الحركة ${(x.sum / x.n).toFixed(2)}%${x.en ? ' • الفرق عن السوق ' + (x.ex / x.en >= 0 ? '+' : '') + (x.ex / x.en).toFixed(2) + '%' : ''}</div>`; }
  const body = keys.length ? h + g : (Object.keys(t.open || {}).length ? '<div>التوقعات اتسجلت وبتستنى الجلسة الجاية. أول نتايج هتظهر بعد 11 صباح الأحد والتطبيق مفتوح.</div>' : '<div>لسه مفيش توقعات مسجلة. التسجيل بيبدأ بعد إغلاق السوق (2:30 ظهرًا) والتطبيق مفتوح.</div>');
  const html = `<summary>تفاصيل الدقة (${(t.log || []).length} نتيجة، ${Object.keys(t.open || {}).length} توقع بانتظار الجلسة الجاية)</summary>${body}<div class="mute2">العرضي = السهم اتحرك أقل من ${SIDE}%. الأرقام من جهازك بس، ومحتاجة أسابيع قبل ما نحكم. «الفرق عن السوق» = حركة السهم ناقص حركة السوق في نفس الجلسة، وده بيفصل جودة التحليل عن اتجاه السوق العام. اتفاق المؤشرات معناه إن المؤشرات متفقة مع بعض، مش ضمان للدقة.</div>`;
  const dt = $('trackd');
  if (dt.dataset.h !== html) { dt.dataset.h = html; const was = dt.querySelector('details'); const op = was && was.open; dt.innerHTML = '<details' + (op ? ' open' : '') + '>' + html + '</details>'; }
}

/* ---------------- التشغيل ---------------- */
let busy = false;
let lastRetry = 0;
async function loop() {
  if (busy) return; busy = true;
  try {
    if (state.mode === 'demo') {
      demoTick();
      if (Date.now() - lastRetry > 15000) {            // لو السيرفر رجع، نتحول للبيانات الحقيقية من غير ريفريش
        lastRetry = Date.now();
        const keep = state.live; state.live = {};
        try { await fetchQuotes(); state.mode = 'live'; state.series = {}; state.fail = 0; } catch (e) { state.live = keep; }
      }
    } else { await fetchQuotes(); state.mode = 'live'; state.fail = 0; }
  } catch (e) {
    state.fail = (state.fail || 0) + 1;
    if (state.mode !== 'live') { state.mode = 'demo'; demoInit(); }
  }
  busy = false;
  render(false); setStatus();
}
function schedule() {
  const open = isMarketOpen(new Date(), state.mode === 'demo');
  const d = document.hidden ? 30000 : open ? CONFIG.POLL_MS : 20000;   // أبطأ لما السوق مقفول أو الصفحة مش قدامك
  setTimeout(async () => { await loop(); schedule(); }, d);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) loop(); });
// تحميل كل أسهم البورصة من المصدر وإضافة اللي مش في القائمة اليدوية (بأسمائها الإنجليزية)
async function loadAll() {
  try {
    const r = await fetch(`${CONFIG.API}?all=1`, { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    const have = new Set(UNIVERSE.map(u => u[0]));
    for (const x of j.all || []) if (!have.has(x.t)) UNIVERSE.push([x.t, x.n, '', x.p]);
  } catch (e) {}
}
async function start() {
  await loadAll();
  try { await fetchQuotes(); state.mode = 'live'; }
  catch (e) { state.mode = 'demo'; demoInit(); demoTick(); }
  render(true); setStatus();
  schedule();
  track(); setInterval(track, 30000);
}
$('cap').value = risk.cap || ''; $('rk').value = risk.rk || '';
['cap', 'rk'].forEach(id => $(id).addEventListener('change', () => {
  risk.cap = parseFloat($('cap').value) || 0; risk.rk = parseFloat($('rk').value) || 0;
  try { localStorage.setItem(RK_KEY, JSON.stringify(risk)); } catch (e) {}
  for (const c of cards.values()) c.last.qty = undefined; render(true);
}));
$('bkx').addEventListener('click', async () => {
  const txt = JSON.stringify({ v: 1, favs: [...favs], pf, risk });
  try { await navigator.clipboard.writeText(txt); toast('اتنسخت النسخة الاحتياطية. الصقها في ملاحظات أو رسالة لنفسك.'); }
  catch (e) { prompt('انسخ النص ده واحتفظ بيه:', txt); }
});
$('bke').addEventListener('click', async () => {
  const t = trkLoad(), txt = JSON.stringify({ v: 2, log: t.log, base: t.base, by: t.by, sg: t.sg });
  try { await navigator.clipboard.writeText(txt); toast('اتنسخت بيانات التتبع (' + t.log.length + ' توقع). الصقها في رسالة وابعتها.'); }
  catch (e) { prompt('انسخ النص ده:', txt); }
});
$('bki').addEventListener('click', () => {
  const t = prompt('الصق النسخة الاحتياطية هنا:'); if (!t) return;
  try {
    const j = JSON.parse(t); if (!j || j.v !== 1) throw 0;
    favs.clear(); (j.favs || []).forEach(x => favs.add(String(x))); saveFavs();
    for (const k of Object.keys(pf)) delete pf[k]; Object.assign(pf, j.pf || {}); savePf();
    Object.assign(risk, j.risk || {}); try { localStorage.setItem(RK_KEY, JSON.stringify(risk)); } catch (e) {}
    toast('اترجعت النسخة. هتظهر في الكروت بعد تحديث الصفحة.');
  } catch (e) { toast('النص ده مش نسخة احتياطية صحيحة.'); }
});
$('q').addEventListener('input', e => { query = e.target.value.trim(); render(true); });
$('sort').addEventListener('change', e => { sortBy = e.target.value; render(true); });
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.f;
  { const N = { rise: 'الترشيح إحصائي من المؤشرات (ميل صاعد بثقة متوسطة أو قوية، وRSI تحت 80). مش ضمان إن السهم هيصعد.',
      sbuy: 'إشارة الشراء قواعد فنية بسيطة، مش توصية. اتأكد من السعر الفعلي في ثاندر وحدّد وقفك قبل الدخول.',
      ssell: 'إشارة البيع قواعد فنية بسيطة (ضعف زخم أو تشبع شراء)، مش توصية. القرار ليك حسب مركزك وخطتك.' };
    $('note').hidden = !N[filter]; if (N[filter]) $('note').textContent = N[filter]; }
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
  render(true);
});
start();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
